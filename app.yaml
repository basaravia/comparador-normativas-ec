# Databricks Apps configuration manifest
# https://docs.databricks.com/en/dev-tools/databricks-apps/app-configuration.html
command:
  - "streamlit"
  - "run"
  - "streamlit_app.py"
  - "--server.address"
  - "0.0.0.0"
  - "--server.port"
  - "8501"
  - "--server.headless"
  - "true"
  - "--browser.gatherUsageStats"
  - "false"

env:
  - name: "DATABRICKS_APP_PORT"
    value: "8501"
  - name: "PYTHONUNBUFFERED"
    value: "1"
