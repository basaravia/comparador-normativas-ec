# Entorno conda para el Comparador de Normativas — Apple Silicon (M1/M2/M3/M4, 16GB)
# Uso: conda env create -f dependencies/environment.yml
#      conda activate normas_comparador
#
# Lista mínima curada para este proyecto (ver dependencies/requirements.txt).
# El environment.yml original en la raíz del repo es un freeze completo de un
# entorno de desarrollo compartido (~300 paquetes ajenos) — no usar para replicar.
name: normas_comparador
channels:
  - conda-forge
dependencies:
  - python=3.13.5
  - pip=25.2
  - pip:
      # torch: PyPI ya publica wheels arm64 con soporte MPS (Metal) para macOS,
      # el índice /cpu también los incluye y evita jalar variantes CUDA de más.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch>=2.5.0
      - torchvision>=0.20.0

      # ── Document parsing ──────────────────────────────────────────────
      - docling==2.55.1
      - ocrmac>=1.0.1                # OCR nativo macOS (Vision) — Apple Silicon only

      # ── LangChain + Docker Model Runner ───────────────────────────────
      - langchain==0.3.27
      - langchain-core==0.3.79
      - langchain-openai==0.3.35     # ChatOpenAI + OpenAIEmbeddings → apunta a DMR
      - langchain-docling==1.1.0     # HybridChunker de Docling integrado en LangChain
      - langchain-text-splitters==0.3.11
      - openai==1.109.1
      - httpx>=0.27.0                # cliente HTTP para el endpoint /rerank de DMR

      # Vertex AI — Provider.VERTEX es el LLM por defecto (ChatVertexAI) y el
      # backend de embeddings validado como alternativa a DMR (VertexAIEmbeddings,
      # ver src/providers.py). No estaba declarado en ningún requirements del
      # repo; sin él, ChatVertexAI falla con ImportError al primer uso.
      - langchain-google-vertexai>=2.1.0

      # ── Vector search ──────────────────────────────────────────────────
      - faiss-cpu==1.14.2            # no existe faiss-gpu para Apple Silicon

      # ── ML / embeddings ────────────────────────────────────────────────
      - transformers>=4.50.0
      - sentence-transformers>=3.0.0 # backend local alternativo (offline)

      # ── Data / export ──────────────────────────────────────────────────
      - pandas>=2.0.0
      - numpy>=2.0.0
      - openpyxl>=3.1.0
      - pillow>=10.0.0

      # ── Utilities ──────────────────────────────────────────────────────
      - tqdm>=4.66.0
      - pydantic>=2.10.0
      - python-dotenv>=1.0.0

      # ── Jupyter ────────────────────────────────────────────────────────
      - ipykernel>=6.29.0
      - ipywidgets>=8.1.0
      - nbconvert>=7.16.0
